[project]
name = "singapore-hdb-resale-price-visual-analytics"
version = "0.1.0"
description = "Singapore Polytechnic ST1502 CA1 data visualisation project on Singapore HDB resale prices."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["scripts", "tests"]
exclude = ["notebooks"]

[tool.ruff.lint]
select = ["B", "D", "E", "F", "I", "SIM", "UP"]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]

[tool.bandit]
exclude_dirs = [".venv", "notebooks"]
skips = []
