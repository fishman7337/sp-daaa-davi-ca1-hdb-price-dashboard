name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    timeout-minutes: 30
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Validate datasets and artifacts
        run: python scripts/validate_data.py

      - name: Lint Python
        run: python -m ruff check scripts tests

      - name: Check Python formatting
        run: python -m ruff format --check scripts tests

      - name: Run pytest
        run: python -m pytest

      - name: Run Bandit security scan
        run: python -m bandit -r scripts

      - name: Compile Python scripts
        run: python -m py_compile scripts/*.py

  dependency-audit:
    timeout-minutes: 30
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Audit development dependencies
        run: pip-audit -r requirements-dev.txt

      - name: Audit cleaning dependencies
        run: pip-audit -r requirements-cleaning.txt

      - name: Audit notebook dependencies
        run: pip-audit -r requirements-notebooks.txt
